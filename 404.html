<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Neurabrix has moved</title>
    <link rel="canonical" href="https://neurabrix.com/">
    <meta http-equiv="refresh" content="0; url=https://neurabrix.com/">
    <script>
      (() => {
        const destination = new URL(window.location.href);
        destination.protocol = "https:";
        destination.hostname = "neurabrix.com";
        destination.port = "";
        window.location.replace(destination.toString());
      })();
    </script>
  </head>
  <body>
    <p>Neurabrix has moved to <a href="https://neurabrix.com/">neurabrix.com</a>.</p>
  </body>
</html>
