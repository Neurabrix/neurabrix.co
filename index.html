<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Neurabrix has moved</title>
    <link rel="canonical" href="https://neurabrix.com/">
    <meta http-equiv="refresh" content="0; url=https://neurabrix.com/">
    <script>
      (() => {
        const destination = new URL(window.location.href);
        destination.protocol = "https:";
        destination.hostname = "neurabrix.com";
        destination.port = "";
        window.location.replace(destination.toString());
      })();
    </script>
    <style>
      body {
        align-items: center;
        background: #07131f;
        color: #f4f7fa;
        display: flex;
        font: 1rem/1.5 system-ui, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      main {
        max-width: 36rem;
        padding: 2rem;
        text-align: center;
      }

      a {
        color: #74d7c4;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Neurabrix has moved</h1>
      <p>Continue to <a href="https://neurabrix.com/">neurabrix.com</a>.</p>
    </main>
  </body>
</html>
