    <script>
      (function(){"use strict";var video=document.getElementById("adaptive-demo"),wrap=document.getElementById("player-wrap"),status=document.getElementById("video-selection"),soundButton=document.getElementById("sound-control"),buttons=Array.from(document.querySelectorAll("[data-format]")),mobileMedia=window.matchMedia("(max-width: 767px), (pointer: coarse) and (max-width: 1024px)"),preference="auto",selected="",playback="starting";video.muted=true;function detectedFormat(){return mobileMedia.matches?"mobile":"desktop"}function updateState(){var activity=playback==="blocked"?"Tap play to start":video.ended?"Finished":video.paused?"Starting":"Playing",format=(selected==="mobile"?"mobile portrait":"desktop widescreen"),sound=video.muted?"muted":"sound on";status.textContent=activity+" · "+(preference==="auto"?"auto-selected ":"")+format+" · "+sound;soundButton.textContent=video.muted?"Sound on":"Sound off";soundButton.setAttribute("aria-label",video.muted?"Turn sound on":"Turn sound off");soundButton.setAttribute("aria-pressed",String(!video.muted));video.dataset.playback=playback;window.__demoVideoSelection={preference:preference,selected:selected,source:video.currentSrc||video.src,playback:playback,muted:video.muted}}function attemptPlayback(){playback="starting";updateState();var promise=video.play();if(promise&&typeof promise.then==="function")promise.then(function(){playback="playing";updateState()}).catch(function(){playback="blocked";updateState()});else{playback=video.paused?"blocked":"playing";updateState()}}function applyFormat(){var next=preference==="auto"?detectedFormat():preference,source=video.dataset[next+"Src"],poster=video.dataset[next+"Poster"];selected=next;wrap.classList.toggle("mobile",next==="mobile");buttons.forEach(function(button){button.setAttribute("aria-pressed",String(button.dataset.format===preference))});if(video.getAttribute("src")!==source){video.pause();video.src=source;video.poster=poster;video.load()}attemptPlayback()}buttons.forE
