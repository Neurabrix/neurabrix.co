    </filter>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#24577D" flood-opacity=".1"/>
    </filter>
  </defs>

  <rect width="840" height="720" rx="32" fill="url(#background)"/>
