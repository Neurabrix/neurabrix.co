<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 720" role="img" aria-labelledby="title desc">
  <title id="title">Neurabrix intelligent systems architecture</title>
  <desc id="desc">Voice, vision, and data connect to an evaluated intelligence core that powers agents, applications, and automation.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="40" x2="760" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCFEFF"/>
      <stop offset=".52" stop-color="#F0F8FB"/>
      <stop offset="1" stop-color="#EDF4FF"/>
    </linearGradient>
    <linearGradient id="core" x1="318" y1="194" x2="548" y2="454" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D9A9A"/>
      <stop offset=".52" stop-color="#168AAE"/>
      <stop offset="1" stop-color="#1769C2"/>
    </linearGradient>
    <linearGradient id="coreGlow" x1="360" y1="230" x2="510" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D4FAF4" stop-opacity=".95"/>
      <stop offset="1" stop-color="#DCEBFF" stop-opacity=".3"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
