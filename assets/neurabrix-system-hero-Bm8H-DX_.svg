  <circle cx="714" cy="92" r="116" fill="#C6F0EC" fill-opacity=".28"/>
  <circle cx="88" cy="636" r="142" fill="#D2E3FA" fill-opacity=".32"/>

  <g fill="none" stroke="#3D91A2" stroke-linecap="round">
